<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management | Libra LMS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Shared Foundation Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/librarian-nav.css}">

    <style>
        :root {
            --bg: #17151D;
            --panel: #24212C;
            --panel-hover: #302A39;
            --text: #F0ECF3;
            --muted: #B8AFBF;
            --accent: #A58AB5;
            --border: rgba(194, 178, 206, 0.2);
            --th-bg: #1F1C26;
            --tr-hover: #302A39;
        }

        body.light,
        [data-theme="light"],
        [data-theme="light"] body {
            --bg: #F3EFF5;
            --panel: #FFFFFF;
            --panel-hover: #E8E0ED;
            --text: #292330;
            --muted: #655C6C;
            --accent: #735681;
            --border: rgba(115, 86, 129, 0.2);
            --th-bg: #E8E0ED;
            --tr-hover: #F8F5FA;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-sans, "Plus Jakarta Sans", sans-serif);
            background: var(--bg);
            color: var(--text);
            transition: background 0.25s, color 0.25s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 22px 6%;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            color: var(--accent);
            font-size: 24px;
            font-weight: bold;
        }

        .librarian-profile-dropdown.open {
            display: block !important;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 25px;
        }

        h1 {
            margin-bottom: 8px;
            font-family: var(--font-serif, "Newsreader", serif);
            color: var(--text);
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .stat-card p {
            color: var(--muted);
            margin: 0 0 12px;
            font-size: 0.9rem;
        }

        .stat-card h2 {
            color: var(--accent);
            font-size: 30px;
            margin: 0;
            font-family: var(--font-sans);
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            background: var(--panel);
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--accent);
            background: var(--th-bg);
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        tbody tr:hover {
            background: var(--tr-hover);
        }

        .role {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .user-role {
            background: rgba(165, 138, 181, 0.18);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .librarian-role {
            background: var(--accent);
            color: #ffffff;
            border: 1px solid var(--border);
        }

        .empty {
            padding: 35px;
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            main {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

<header th:replace="~{fragments/librarian-nav :: librarian-navbar('users')}"></header>

<main>

    <h1>User Management</h1>

    <p class="subtitle">
        View registered library members and their account roles.
    </p>

    <section class="stats">

        <div class="stat-card">
            <p>Registered Members</p>
            <h2 th:text="${totalUsers}">0</h2>
        </div>

        <div class="stat-card">
            <p>Librarian Accounts</p>
            <h2 th:text="${librarianCount}">0</h2>
        </div>

    </section>

    <div class="table-wrapper" th:if="${!users.isEmpty()}">

        <table>
            <thead>
                <tr>
                    <th>Account ID</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="user : ${users}">

                    <td th:text="${user.id}">1</td>

                    <td th:text="${user.fullName}">Full Name</td>

                    <td th:text="${user.email}">user@example.com</td>

                    <td>
                        <span
                            class="role"
                            th:classappend="${user.role == 'LIBRARIAN'} ? ' librarian-role' : ' user-role'"
                            th:text="${user.role}">
                            USER
                        </span>
                    </td>

                </tr>
            </tbody>
        </table>

    </div>

    <div class="empty" th:if="${users.isEmpty()}">
        <h2>No registered accounts</h2>
        <p>Accounts will appear here when users register.</p>
    </div>

</main>

<!-- Motion & Animation Scripts (Deferred with Graceful Offline Fallback) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js" defer></script>
<script th:src="@{/js/cinematic-motion.js}" defer></script>

</body>
</html>
