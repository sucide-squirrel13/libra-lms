<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libra LMS | Edit Book</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1120;
            --panel: #131d30;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #26354b;
            --accent: #65e6bd;
            --accent-text: #071b16;
            --input: #0b1120;
        }

        body.light {
            color-scheme: light;
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e1e7ef;
            --accent: #087f66;
            --accent-text: #ffffff;
            --input: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px;
        }

        .brand {
            color: var(--accent);
            font-weight: 800;
            font-size: 22px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .muted {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 650;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--input);
            color: var(--text);
            font: inherit;
        }

        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .error {
            color: #fb7185;
            font-size: 13px;
            margin-top: 6px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .back {
            border-radius: 9px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
        }

        .back {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .theme-button {
            float: right;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 13px;
            padding: 8px 10px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <button type="button" class="theme-button" id="theme-toggle">
        ☀️ Light mode
    </button>

    <div class="brand">L Libra LMS</div>

    <h1>Edit Book</h1>
    <p class="muted">Update the selected book's information.</p>

    <form th:action="@{/librarian/books/update/{id}(id=${book.id})}"
          th:object="${book}"
          method="post">

        <label for="title">Book Title</label>
        <input id="title" type="text" th:field="*{title}" required>
        <div class="error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}"></div>

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}" required>
        <div class="error"
             th:if="${#fields.hasErrors('author')}"
             th:errors="*{author}"></div>

        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}" required>
        <div class="error"
             th:if="${#fields.hasErrors('isbn')}"
             th:errors="*{isbn}"></div>

        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}" required>
        <div class="error"
             th:if="${#fields.hasErrors('category')}"
             th:errors="*{category}"></div>

        <label for="quantity">Total Copies</label>
        <input id="quantity"
               type="number"
               th:field="*{quantity}"
               min="1"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('quantity')}"
             th:errors="*{quantity}"></div>

        <div class="actions">
            <button type="submit">Save Changes</button>
            <a class="back" th:href="@{/librarian}">Cancel</a>
        </div>

    </form>
</div>

<script>
    const themeButton = document.getElementById("theme-toggle");

    function applyTheme(theme) {
        document.body.classList.toggle("light", theme === "light");

        themeButton.textContent =
            theme === "light" ? "🌙 Dark mode" : "☀️ Light mode";

        localStorage.setItem("libra-theme", theme);
    }

    themeButton.addEventListener("click", () => {
        const currentTheme =
            document.body.classList.contains("light") ? "light" : "dark";

        applyTheme(currentTheme === "light" ? "dark" : "light");
    });

    applyTheme(localStorage.getItem("libra-theme") || "dark");
</script>

</body>
</html>
