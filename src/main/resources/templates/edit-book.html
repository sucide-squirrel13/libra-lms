<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libra LMS | Edit Book</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Shared Foundation Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/librarian-nav.css}">

    <style>
        :root {
            color-scheme: dark;
            --bg: #17151D;
            --panel: #24212C;
            --text: #F0ECF3;
            --muted: #B8AFBF;
            --border: rgba(194, 178, 206, 0.2);
            --accent: #A58AB5;
            --accent-text: #17151D;
            --accent-purple: #A58AB5;
            --input: #1F1C26;
        }

        body.light,
        [data-theme="light"],
        [data-theme="light"] body {
            color-scheme: light;
            --bg: #F3EFF5;
            --panel: #FFFFFF;
            --text: #292330;
            --muted: #655C6C;
            --border: rgba(115, 86, 129, 0.2);
            --accent: #735681;
            --accent-text: #FFFFFF;
            --accent-purple: #735681;
            --input: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 90px 25px 40px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: var(--font-sans, "Plus Jakarta Sans", sans-serif);
            background: var(--bg);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(24, 20, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(194, 178, 206, 0.18);
            border-radius: 22px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        .brand {
            color: var(--accent);
            font-weight: 800;
            font-size: 22px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .muted {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 650;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(194, 178, 206, 0.22);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font: inherit;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: rgba(165, 138, 181, 0.6);
            background: rgba(255, 255, 255, 0.08);
        }

        .error {
            color: #fb7185;
            font-size: 13px;
            margin-top: 6px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .back {
            border-radius: 9px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: var(--accent-purple, #88758F);
            color: #ffffff;
            border: 1px solid rgba(136, 117, 143, 0.4);
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #9b87a3;
            transform: translateY(-1px);
        }

        .back {
            background: rgba(136, 117, 143, 0.15);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .theme-button {
            float: right;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 13px;
            padding: 8px 10px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<header th:replace="~{fragments/librarian-nav :: librarian-navbar('books')}"></header>
<div class="container">

    <div class="brand">L Libra LMS</div>

    <h1>Edit Book</h1>
    <p class="muted">Update the selected book's information.</p>

    <form th:action="@{/librarian/books/update/{id}(id=${book.id})}"
          th:object="${book}"
          method="post">

        <label for="title">Book Title</label>
        <input id="title" type="text" th:field="*{title}" required>
        <div class="error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}"></div>

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}" required>
        <div class="error"
             th:if="${#fields.hasErrors('author')}"
             th:errors="*{author}"></div>

        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}" required>
        <div class="error"
             th:if="${#fields.hasErrors('isbn')}"
             th:errors="*{isbn}"></div>

        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}" required>
        <div class="error"
             th:if="${#fields.hasErrors('category')}"
             th:errors="*{category}"></div>

        <label for="quantity">Total Copies</label>
        <input id="quantity"
               type="number"
               th:field="*{quantity}"
               min="1"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('quantity')}"
             th:errors="*{quantity}"></div>

        <div class="actions">
            <button type="submit">Save Changes</button>
            <a class="back" th:href="@{/librarian}">Cancel</a>
        </div>

    </form>
</div>

<!-- Motion & Animation Scripts (Deferred with Graceful Offline Fallback) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js" defer></script>
<script th:src="@{/js/cinematic-motion.js}" defer></script>

</body>
</html>
