<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<header class="navbar" th:fragment="navigation">
    <script>
        (function() {
            try {
                var s = localStorage.getItem('libra-theme');
                var p = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var t = (s === 'system' || !s) ? (p ? 'dark' : 'light') : s;
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'light') { document.documentElement.classList.add('light'); }
                else { document.documentElement.classList.remove('light'); }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <!-- BRAND -->
    <a th:href="@{/}" class="brand">
        <span class="brand-logo">L</span>
        <span class="brand-name">Libra LMS</span>
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button type="button"
            class="mobile-menu-button"
            id="mobile-menu-button"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="nav-right">
        ☰
    </button>

    <!-- NAVIGATION -->
    <nav class="nav-right" id="nav-right">

        <!-- HOME -->
        <a class="nav-link" th:href="@{/}">
            Home
        </a>

        <!-- DASHBOARD -->
        <a class="nav-link"
           th:href="${user != null and user.role != null and user.role.toString() == 'LIBRARIAN'}
                    ? @{/librarian}
                    : (${user != null} ? @{/user/dashboard} : @{/login})"
           th:text="${user != null and user.role != null and user.role.toString() == 'LIBRARIAN'}
                    ? 'Librarian Dashboard'
                    : 'Dashboard'">
            Dashboard
        </a>

        <!-- BOOK CATALOGUE -->
        <a class="nav-link" th:href="@{/books}">
            Explore Books
        </a>

        <!-- USER BORROWINGS -->
        <a class="nav-link"
           th:if="${user != null and user.role != null and user.role.toString() == 'USER'}"
           th:href="@{/user/borrowings}">
            My Borrowings
        </a>

        <!-- PROFILE AREA (When Authenticated) -->
        <div class="profile-area" th:if="${user != null}">

            <!-- PROFILE TRIGGER -->
            <button type="button"
                    class="profile-trigger"
                    id="profile-trigger"
                    onclick="window.toggleLibraProfile(event)"
                    aria-expanded="false"
                    aria-controls="profile-menu">

                <span class="avatar" id="navbar-avatar">

                    <img th:src="@{/profile/photo}"
                         alt="Profile picture">

                    <span class="avatar-initial"
                          id="navbar-initial"
                          th:text="${user.fullName != null and !user.fullName.isEmpty()
                                    ? user.fullName.substring(0, 1).toUpperCase()
                                    : 'U'}">
                        U
                    </span>

                </span>

                <span class="profile-trigger-name"
                      th:text="${user.fullName}">
                    User
                </span>

                <span class="profile-chevron" aria-hidden="true">
                    ⌄
                </span>

            </button>

            <!-- PROFILE DROPDOWN -->
            <div class="profile-menu"
                 id="profile-menu">

                <!-- PROFILE INFORMATION -->
                <div class="profile-heading">

                    <span class="avatar" id="menu-avatar">

                        <img th:src="@{/profile/photo}"
                             alt="Profile picture">

                        <span class="avatar-initial"
                              id="menu-initial"
                              th:text="${user.fullName != null and !user.fullName.isEmpty()
                                        ? user.fullName.substring(0, 1).toUpperCase()
                                        : 'U'}">
                            U
                        </span>

                    </span>

                    <div class="profile-user-details">

                        <strong th:text="${user.fullName}">
                            User
                        </strong>

                        <small th:text="${user.email}">
                            user@example.com
                        </small>

                        <small class="profile-role"
                               th:text="${user.role}">
                            USER
                        </small>

                    </div>

                </div>

                <!-- CHANGE PROFILE PICTURE -->
                <form th:action="@{/profile/photo}"
                      method="post"
                      enctype="multipart/form-data"
                      id="profile-photo-form">

                    <!-- CSRF PROTECTION -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- HIDDEN FILE INPUT -->
                    <input type="file"
                           name="photo"
                           id="profile-photo"
                           accept="image/png,image/jpeg"
                           onchange="document.getElementById('profile-photo-form').submit()"
                           style="display: none;">

                    <!-- CHANGE PHOTO BUTTON -->
                    <label for="profile-photo"
                           class="menu-button">
                        Change Profile Picture
                    </label>

                </form>

                <!-- REMOVE PROFILE PICTURE (When Photo Exists) -->
                <form th:action="@{/profile/photo/remove}"
                      method="post"
                      id="remove-photo-form">

                    <!-- CSRF PROTECTION -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- REMOVE PHOTO BUTTON -->
                    <button type="submit"
                            class="menu-button"
                            id="remove-photo-button">
                        Remove Photo
                    </button>

                </form>

                <div class="profile-divider"></div>

                <!-- SETTINGS LINK -->
                <a th:href="@{/settings}"
                   class="profile-menu-link">
                    Settings
                </a>

                <div class="profile-divider"></div>

                <!-- LOGOUT -->
                <form th:action="@{/logout}"
                      method="post"
                      class="logout-form">

                    <!-- CSRF PROTECTION -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- LOGOUT BUTTON -->
                    <button type="submit"
                            class="menu-button logout-button">
                        Log Out
                    </button>

                </form>

            </div>

        </div>

        <!-- AUTH ACTIONS (When Unauthenticated) -->
        <div class="auth-actions" th:if="${user == null}" style="display: flex; align-items: center; gap: 8px;">
            <a class="nav-link" th:href="@{/login}">Log In</a>
        </div>

        <!-- THEME TOGGLE (Ink Bleed Reveal Transition) -->
        <button type="button"
                class="theme-btn theme-toggle-btn"
                id="themeBtn"
                aria-label="Toggle light or dark theme"
                title="Toggle light or dark theme"
                data-cursor>
            <span class="theme-toggle-icon" aria-hidden="true">
                <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
        </button>

    </nav>

    <!-- INSTANT INLINE TOGGLE LOGIC -->
    <script>
        window.toggleLibraProfile = window.toggleLibraProfile || function(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            var menu = document.getElementById("profile-menu");
            var trigger = document.getElementById("profile-trigger");
            if (!menu) return;
            var isOpen = menu.classList.toggle("open");
            if (trigger) trigger.setAttribute("aria-expanded", String(isOpen));
        };
        window.closeLibraProfile = window.closeLibraProfile || function() {
            var menu = document.getElementById("profile-menu");
            var trigger = document.getElementById("profile-trigger");
            if (menu) menu.classList.remove("open");
            if (trigger) trigger.setAttribute("aria-expanded", "false");
        };
    </script>

    <!-- SHARED NAVBAR JAVASCRIPT -->
    <script th:src="@{/js/navbar.js}" defer></script>
    <script th:src="@{/js/axon-background.js}" defer></script>

    <!-- GLOBAL CIRCLE CURSOR -->
    <div class="cur-dot" id="cursor" aria-hidden="true"></div>

</header>

</body>
</html>
