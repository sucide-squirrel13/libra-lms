<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<header class="navbar" th:fragment="navigation">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <!-- BRAND -->
    <a th:href="@{/}" class="brand">
        <span class="brand-logo">L</span>
        <span class="brand-name">Libra LMS</span>
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button type="button"
            class="mobile-menu-button"
            id="mobile-menu-button"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="nav-right">
        ☰
    </button>

    <!-- NAVIGATION -->
    <nav class="nav-right" id="nav-right">

        <!-- HOME -->
        <a class="nav-link" th:href="@{/}">
            Home
        </a>

        <!-- DASHBOARD -->
        <a class="nav-link"
           th:href="${user != null and user.role != null and user.role.toString() == 'LIBRARIAN'}
                    ? @{/librarian}
                    : (${user != null} ? @{/user/dashboard} : @{/login})">
            Dashboard
        </a>

        <!-- BOOK CATALOGUE -->
        <a class="nav-link" th:href="@{/books}">
            Explore Books
        </a>

        <!-- USER BORROWINGS -->
        <a class="nav-link"
           th:if="${user != null and user.role != null and user.role.toString() == 'USER'}"
           th:href="@{/user/borrowings}">
            My Borrowings
        </a>

        <!-- PROFILE AREA (When Authenticated) -->
        <div class="profile-area" th:if="${user != null}">

            <!-- PROFILE TRIGGER -->
            <button type="button"
                    class="profile-trigger"
                    id="profile-trigger"
                    onclick="window.toggleLibraProfile(event)"
                    aria-expanded="false"
                    aria-controls="profile-menu">

                <span class="avatar" id="navbar-avatar">

                    <img th:src="@{/profile/photo}"
                         alt="Profile picture">

                    <span class="avatar-initial"
                          id="navbar-initial"
                          th:text="${user.fullName != null and !user.fullName.isEmpty()
                                    ? user.fullName.substring(0, 1).toUpperCase()
                                    : 'U'}">
                        U
                    </span>

                </span>

                <span class="profile-trigger-name"
                      th:text="${user.fullName}">
                    User
                </span>

                <span class="profile-chevron" aria-hidden="true">
                    ⌄
                </span>

            </button>

            <!-- PROFILE DROPDOWN -->
            <div class="profile-menu"
                 id="profile-menu">

                <!-- PROFILE INFORMATION -->
                <div class="profile-heading">

                    <span class="avatar" id="menu-avatar">

                        <img th:src="@{/profile/photo}"
                             alt="Profile picture">

                        <span class="avatar-initial"
                              id="menu-initial"
                              th:text="${user.fullName != null and !user.fullName.isEmpty()
                                        ? user.fullName.substring(0, 1).toUpperCase()
                                        : 'U'}">
                            U
                        </span>

                    </span>

                    <div class="profile-user-details">

                        <strong th:text="${user.fullName}">
                            User
                        </strong>

                        <small th:text="${user.email}">
                            user@example.com
                        </small>

                        <small class="profile-role"
                               th:text="${user.role}">
                            USER
                        </small>

                    </div>

                </div>

                <!-- CHANGE PROFILE PICTURE -->
                <form th:action="@{/profile/photo}"
                      method="post"
                      enctype="multipart/form-data"
                      id="profile-photo-form">

                    <!-- CSRF PROTECTION -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- HIDDEN FILE INPUT -->
                    <input type="file"
                           name="photo"
                           id="profile-photo"
                           accept="image/png,image/jpeg"
                           hidden>

                    <!-- OPEN FILE PICKER -->
                    <button type="button"
                            class="menu-button upload-button"
                            id="change-photo-button">

                        <span aria-hidden="true">📷</span>
                        Change Profile Picture

                    </button>

                </form>

                <div class="profile-divider"></div>

                <!-- DASHBOARD -->
                <a class="profile-menu-link"
                   th:href="${user.role != null and user.role.toString() == 'LIBRARIAN'}
                            ? @{/librarian}
                            : @{/user/dashboard}">

                    <span aria-hidden="true">⌂</span>
                    Dashboard

                </a>

                <!-- EXPLORE BOOKS -->
                <a class="profile-menu-link"
                   th:href="@{/books}">

                    <span aria-hidden="true">▤</span>
                    Explore Books

                </a>

                <!-- MY BORROWINGS -->
                <a class="profile-menu-link"
                   th:if="${user.role != null and user.role.toString() == 'USER'}"
                   th:href="@{/user/borrowings}">

                    <span aria-hidden="true">◷</span>
                    My Borrowings

                </a>

                <div class="profile-divider"></div>

                <!-- LOGOUT -->
                <form th:action="@{/logout}"
                      method="post">

                    <!-- CSRF PROTECTION -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="menu-button logout-button">

                        <span aria-hidden="true">↪</span>
                        Log Out

                    </button>

                </form>

            </div>

        </div>

        <!-- AUTH ACTIONS (When Unauthenticated) -->
        <div class="auth-actions" th:if="${user == null}" style="display: flex; align-items: center; gap: 8px;">
            <a class="nav-link" th:href="@{/login}">Log In</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}">Register</a>
        </div>

    </nav>

    <!-- INSTANT INLINE TOGGLE LOGIC -->
    <script>
        window.toggleLibraProfile = window.toggleLibraProfile || function(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            var menu = document.getElementById("profile-menu");
            var trigger = document.getElementById("profile-trigger");
            if (!menu) return;
            var isOpen = menu.classList.toggle("open");
            if (trigger) trigger.setAttribute("aria-expanded", String(isOpen));
        };
        window.closeLibraProfile = window.closeLibraProfile || function() {
            var menu = document.getElementById("profile-menu");
            var trigger = document.getElementById("profile-trigger");
            if (menu) menu.classList.remove("open");
            if (trigger) trigger.setAttribute("aria-expanded", "false");
        };
    </script>

    <!-- SHARED NAVBAR JAVASCRIPT -->
    <script th:src="@{/js/navbar.js}" defer></script>

</header>

</body>
</html>
