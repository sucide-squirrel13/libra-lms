<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Libra LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0b1120;
            color: #e5edf7;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #151f32;
            border: 1px solid #26364d;
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
            color: #5eead4;
        }

        p {
            color: #a9b8cc;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #35465f;
            border-radius: 8px;
            background: #0b1120;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2dd4bf;
            color: #062521;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin: 14px 0;
        }

        .error {
            background: #451a24;
            color: #fecaca;
        }

        a {
            color: #5eead4;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>Create your account</h1>
    <p>Join Libra LMS to explore the library catalogue.</p>

    <div class="message error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/register}" method="post">

        <label for="fullName">Full name</label>
        <input id="fullName"
               type="text"
               name="fullName"
               maxlength="100"
               autocomplete="name"
               required>

        <label for="email">Email address</label>
        <input id="email"
               type="email"
               name="email"
               maxlength="254"
               autocomplete="email"
               required>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               name="password"
               minlength="8"
               autocomplete="new-password"
               required>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer">
        Already registered?
        <a th:href="@{/login}">Log in</a>
        <br><br>
        <a th:href="@{/}">Back to Home</a>
    </div>
</div>
</body>
</html>
