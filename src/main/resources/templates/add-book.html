<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libra LMS | Add Book</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Shared Foundation Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/librarian-nav.css}">

    <style>
        :root {
            color-scheme: dark;
            --bg: #17151D;
            --panel: #24212C;
            --text: #F0ECF3;
            --muted: #B8AFBF;
            --border: rgba(194, 178, 206, 0.2);
            --accent: #A58AB5;
            --accent-purple: #A58AB5;
            --input: #1F1C26;
        }

        body.light,
        [data-theme="light"],
        [data-theme="light"] body {
            color-scheme: light;
            --bg: #F3EFF5;
            --panel: #FFFFFF;
            --text: #292330;
            --muted: #655C6C;
            --border: rgba(115, 86, 129, 0.2);
            --accent: #735681;
            --accent-purple: #735681;
            --input: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: var(--font-sans, "Plus Jakarta Sans", sans-serif);
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 30px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
        }

        button, .back {
            display: inline-block;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: var(--accent-purple, #88758F);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover, .back:hover {
            background: #9b87a3;
            transform: translateY(-1px);
        }

        .submit {
            width: 100%;
            margin-top: 25px;
            background: var(--accent-purple, #88758F);
            color: #ffffff;
        }

        .secondary {
            background: rgba(136, 117, 143, 0.15);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .error {
            color: #ff8080;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>

<body>
<header th:replace="~{fragments/librarian-nav :: librarian-navbar('books')}"></header>

<div class="container">

    <div class="top">
        <h1>📚 Add a New Book</h1>

        <button type="button" class="secondary" id="theme-toggle">
            ☀️ Light
        </button>
    </div>

    <p>Enter the book details to add it to your library catalogue.</p>

    <form th:action="@{/librarian/books}"
          th:object="${book}"
          method="post">

        <label for="title">Book Title</label>
        <input id="title"
               type="text"
               th:field="*{title}"
               placeholder="e.g. Clean Code"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}"></div>

        <label for="author">Author</label>
        <input id="author"
               type="text"
               th:field="*{author}"
               placeholder="e.g. Robert C. Martin"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('author')}"
             th:errors="*{author}"></div>

        <label for="isbn">ISBN</label>
        <input id="isbn"
               type="text"
               th:field="*{isbn}"
               placeholder="Enter a unique ISBN"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('isbn')}"
             th:errors="*{isbn}"></div>

        <label for="category">Category</label>
        <input id="category"
               type="text"
               th:field="*{category}"
               placeholder="e.g. Computer Science"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('category')}"
             th:errors="*{category}"></div>

        <label for="quantity">Number of Copies</label>
        <input id="quantity"
               type="number"
               th:field="*{quantity}"
               min="1"
               value="1"
               required>
        <div class="error"
             th:if="${#fields.hasErrors('quantity')}"
             th:errors="*{quantity}"></div>

        <button class="submit" type="submit">
            Save Book to Library
        </button>
    </form>

    <p>
        <a class="back" th:href="@{/librarian}">
            ← Back to Dashboard
        </a>
    </p>

</div>

<script>
    const toggle = document.getElementById("theme-toggle");

    function applyTheme(theme) {
        document.body.classList.toggle("light", theme === "light");

        toggle.textContent =
            theme === "light" ? "🌙 Dark" : "☀️ Light";

        localStorage.setItem("libra-theme", theme);
    }

    toggle.addEventListener("click", () => {
        const isLight = document.body.classList.contains("light");

        applyTheme(isLight ? "dark" : "light");
    });

    applyTheme(localStorage.getItem("libra-theme") || "dark");
</script>

<!-- Motion & Animation Scripts (Deferred with Graceful Offline Fallback) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js" defer></script>
<script th:src="@{/js/cinematic-motion.js}" defer></script>

</body>
</html>
