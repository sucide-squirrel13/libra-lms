spring.application.name=lms

# PostgreSQL Configuration
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables
# or override in application-local.properties (gitignored).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}
spring.thymeleaf.cache=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:./src/main/resources/application-local.properties
# Local development: when the `local` profile is active (e.g. via
# SPRING_PROFILES_ACTIVE=local), the document below imports the gitignored
# local overrides from the project directory. Optional - a missing file is
# silently ignored, so production/default stay unaffected. The file itself
# is excluded from the packaged artifact and Docker context (pom.xml,
# .dockerignore). In .properties files the separator is a comment line
# `#---`; per Spring Boot it must directly follow a property line and be
# directly followed by a property line, so all comments live below.
